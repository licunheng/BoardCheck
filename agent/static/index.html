<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>板检数据核验 Agent</title>
  <style>
    :root {
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-3: #64748b;
      --line: #e2e8f0;
      --bg: #f4f6f9;
      --surface: #ffffff;
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --ok: #16a34a;
      --warn: #d97706;
      --err: #dc2626;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 顶栏 ─────────────────────────────── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .topbar-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .brand-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .topbar-meta {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      color: var(--ink-3);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink-2);
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
    .pill.ok .dot { background: var(--ok); }
    .pill.warn .dot { background: var(--warn); }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1.75rem 2rem 4rem;
    }

    /* ── 引导条 ───────────────────────────── */
    .guide {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--accent-soft);
      border: 1px solid rgba(37, 99, 235, 0.15);
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: var(--ink-2);
    }
    .guide-icon {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700;
    }

    /* ── 流程步骤卡 ───────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1rem;
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card:hover { box-shadow: var(--shadow-lg); }
    .card.done { border-color: var(--ok); }
    .card.error { border-color: var(--err); }

    .card-head {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .step-idx {
      width: 26px; height: 26px;
      border-radius: 7px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink-2);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .card.done .step-idx { background: var(--ok); border-color: var(--ok); color: #fff; }
    .card.error .step-idx { background: var(--err); border-color: var(--err); color: #fff; }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .card-sub {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--ink-3);
    }

    /* ── 控件 ─────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-2);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    select, input[type="text"], input[type="password"], input[type="file"], textarea {
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.75rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    select { min-width: 220px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: var(--ink-3);
    }

    .status {
      font-size: 0.85rem;
      color: var(--ink-3);
    }
    .status.ok { color: var(--ok); font-weight: 500; }
    .status.err { color: var(--err); font-weight: 500; }

    /* ── 文件列表 ─────────────────────────── */
    .upload-list {
      margin-top: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .upload-list .file-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.82rem;
      color: var(--ink-2);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 0.4rem 0.7rem;
      border-radius: var(--radius-sm);
    }
    .upload-list .file-row .fname {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
    }
    .upload-list .file-row button {
      padding: 0.15rem 0.55rem;
      font-size: 0.72rem;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--err);
      cursor: pointer;
    }

    /* ── 结果统计 ─────────────────────────── */
    .result-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.9rem;
      margin-top: 1rem;
    }
    .result-card {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 0.9rem 0.8rem;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .result-card .num {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .result-card.ok .num { color: var(--ok); }
    .result-card.warn .num { color: var(--warn); }
    .result-card.err .num { color: var(--err); }
    .result-card .label {
      font-size: 0.72rem;
      color: var(--ink-3);
      margin-top: 0.3rem;
      letter-spacing: 0.02em;
    }

    /* ── 下载/历史 ────────────────────────── */
    .download-list { list-style: none; padding: 0; margin: 0.9rem 0 0; }
    .download-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0.4rem;
      border-bottom: 1px solid var(--line);
    }
    .download-list li:last-child { border: 0; }
    .download-list .name {
      flex: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      color: var(--ink-2);
    }
    .download-list a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .download-list a:hover { text-decoration: underline; }

    .history-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.5rem;
      background: var(--bg);
    }
    .history-item .meta { font-size: 0.78rem; color: var(--ink-3); margin-bottom: 0.2rem; }
    .history-item .files a { margin-right: 1rem; color: var(--accent); font-size: 0.82rem; }

    .empty {
      text-align: center;
      padding: 1.5rem;
      color: var(--ink-3);
      font-size: 0.85rem;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 500;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink-2);
    }
    .badge.ok { background: rgba(22, 163, 74, 0.1); color: var(--ok); border-color: rgba(22, 163, 74, 0.25); }

    /* ── 设置 ─────────────────────────────── */
    details.settings summary {
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--ink-2);
      outline: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    details.settings summary::after {
      content: "›";
      margin-left: auto;
      color: var(--ink-3);
      transition: transform 0.15s ease;
      font-size: 1rem;
    }
    details.settings[open] summary::after { transform: rotate(90deg); }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 0.8rem;
      margin: 1rem 0;
    }

    textarea {
      width: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      resize: vertical;
    }

    .review-options { margin-top: 0.9rem; }
    .review-options label {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.85rem;
      color: var(--ink-2);
    }
    .review-options .sub { margin-left: 1.5rem; margin-top: 0.3rem; display: none; }
    .review-options .sub label { font-size: 0.78rem; color: var(--ink-3); }

    .divider { border: 0; border-top: 1px solid var(--line); margin: 1rem 0; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-dot"></span>板检数据核验 Agent</div>
      <div class="topbar-meta">
        <span class="pill ok"><span class="dot"></span>本地运行</span>
        <span id="llm-pill" class="pill warn"><span class="dot"></span>LLM 未配置</span>
      </div>
    </div>
  </div>

  <main>

    <div class="guide">
      <span class="guide-icon">i</span>
      <div>先选择设备型号,再依次上传板检日志与平台 CSV,点击「开始核验」,最后下载报告。所有计算均在本地完成,LLM 复核为可选项。</div>
    </div>

    <!-- LLM 设置 -->
    <section class="card" id="step-settings">
      <div class="card-head">
        <div class="step-idx">S</div>
        <div class="card-title">LLM 设置(可选)</div>
        <div class="card-sub" id="llm-status-badge">未配置</div>
      </div>
      <details class="settings">
        <summary>展开设置</summary>
        <div class="settings-grid">
          <label class="field">服务商
            <select id="set-provider">
              <option value="anthropic">Anthropic Claude</option>
              <option value="openai_compat">OpenAI 兼容接口</option>
            </select>
          </label>
          <label class="field">模型
            <input type="text" id="set-model" placeholder="claude-3-5-sonnet-20241022 / gpt-4o" />
          </label>
          <label class="field">API Key
            <input type="password" id="set-api-key" placeholder="sk-... (留空保持不变)" autocomplete="off" />
          </label>
          <label class="field">接口地址(可选)
            <input type="text" id="set-base-url" placeholder="默认 https://api.anthropic.com/v1" />
          </label>
        </div>
        <div class="btn-row">
          <button class="primary" onclick="saveSettings()">保存设置</button>
          <button onclick="testSettings()">测试连接</button>
          <span class="status" id="settings-status"></span>
        </div>
        <hr class="divider" />
        <div class="settings-grid">
          <label class="field">上传目录
            <input type="text" id="set-upload-dir" placeholder="默认:工程内 uploads/" />
          </label>
          <label class="field">输出目录
            <input type="text" id="set-output-dir" placeholder="默认:工程内 outputs/" />
          </label>
        </div>
        <div class="btn-row">
          <button class="primary" onclick="saveStorage()">保存存储目录</button>
          <span class="status" id="storage-status"></span>
        </div>
      </details>
    </section>

    <!-- 步骤 0: 选择设备 -->
    <section class="card" id="step-device">
      <div class="card-head">
        <div class="step-idx">0</div>
        <div class="card-title">选择设备型号</div>
        <div class="card-sub" id="device-sub"></div>
      </div>
      <div class="btn-row">
        <select id="device-select">
          <option value="">-- 请选择设备 --</option>
        </select>
        <span id="device-info" class="badge" style="display:none;"></span>
      </div>
    </section>

    <!-- 步骤 1: 上传板检数据 -->
    <section class="card" id="step-raw">
      <div class="card-head">
        <div class="step-idx">1</div>
        <div class="card-title">导入板检数据</div>
        <div class="card-sub">.txt / .log / .db / .sqlite(可多选)</div>
      </div>
      <div class="btn-row">
        <input type="file" id="raw-file" accept=".txt,.log,.db,.sqlite,.sqlite3,.csv" multiple />
        <button class="primary" onclick="uploadRaw()">上传</button>
      </div>
      <div class="status" id="raw-status"></div>
      <div id="raw-list" class="upload-list"></div>
    </section>

    <!-- 步骤 2: 上传平台 CSV -->
    <section class="card" id="step-platform">
      <div class="card-head">
        <div class="step-idx">2</div>
        <div class="card-title">导入平台 CSV</div>
        <div class="card-sub">从追溯平台导出的本批数据(可多选)</div>
      </div>
      <div class="btn-row">
        <input type="file" id="platform-file" accept=".csv,.xls,.xlsx" multiple />
        <button class="primary" onclick="uploadPlatform()">上传</button>
      </div>
      <div class="status" id="platform-status"></div>
      <div id="platform-list" class="upload-list"></div>
    </section>

    <!-- 步骤 3: 开始核验 -->
    <section class="card" id="step-verify">
      <div class="card-head">
        <div class="step-idx">3</div>
        <div class="card-title">开始核验</div>
        <div class="card-sub" id="verify-sub"></div>
      </div>
      <div class="btn-row">
        <button class="primary" id="btn-verify" onclick="startVerify()" disabled>开始核验</button>
        <span class="status" id="verify-status"></span>
      </div>
      <div class="review-options">
        <label><input type="checkbox" id="rev-master" /> 启用 LLM 智能复核(较慢,需已配置 API Key)</label>
        <div class="sub" id="rev-sub">
          <label><input type="checkbox" id="rev-independent" /> 独立抽取交叉验证(很慢)</label>
          <label><input type="checkbox" id="rev-comparison" /> 不一致记录复核(较快)</label>
        </div>
      </div>
    </section>

    <!-- 步骤 4: 下载报告 -->
    <section class="card" id="step-download">
      <div class="card-head">
        <div class="step-idx">4</div>
        <div class="card-title">下载报告</div>
        <div class="card-sub" id="download-sub"></div>
      </div>
      <div id="download-area">
        <div class="empty">尚未生成报告,请先完成核验</div>
      </div>
    </section>

    <!-- 历史记录 -->
    <section class="card" id="step-history">
      <div class="card-head">
        <div class="step-idx">5</div>
        <div class="card-title">历史记录</div>
        <div class="card-sub">刷新不丢失,按时间倒序</div>
      </div>
      <div id="history-area">
        <div class="empty">加载中...</div>
      </div>
    </section>

    <!-- 新增设备配置 -->
    <section class="card" id="step-generate">
      <div class="card-head">
        <div class="step-idx">+</div>
        <div class="card-title">新增设备配置</div>
        <div class="card-sub">描述规则 → 调用大模型 → 生成通用配置</div>
      </div>
      <div class="settings-grid" style="grid-template-columns:1fr 1fr;">
        <label class="field">设备代号(如 B01X)
          <input type="text" id="gen-code" placeholder="B01X" />
        </label>
        <label class="field">是否 4G 设备
          <select id="gen-is4g">
            <option value="">自动推断</option>
            <option value="true">是(需 ICCID)</option>
            <option value="false">否</option>
          </select>
        </label>
      </div>
      <label class="field" style="margin-bottom:0.8rem;">板检规则描述
        <textarea id="gen-desc" rows="4" placeholder="字段格式、日志行模式、绑定关系、平台列名等"></textarea>
      </label>
      <label class="field" style="margin-bottom:0.8rem;">板检日志样例(可选,强烈建议)
        <textarea id="gen-log" rows="5" placeholder="粘贴若干行真实板检日志"></textarea>
      </label>
      <label class="field" style="margin-bottom:0.8rem;">平台 CSV 样例(可选,含表头与 1~2 行)
        <textarea id="gen-csv" rows="3" placeholder="追溯码,SN,MAC,4G信息"></textarea>
      </label>
      <label style="display:flex;gap:0.5rem;align-items:center;font-size:0.8rem;color:var(--ink-3);margin-bottom:0.8rem;">
        <input type="checkbox" id="gen-overwrite" /> 覆盖已有同名配置
      </label>
      <div class="btn-row">
        <button class="primary" id="btn-generate" onclick="generateDevice()">生成配置</button>
        <span class="status" id="gen-status"></span>
      </div>
      <div id="gen-result" style="margin-top:0.8rem;"></div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
